[package]
name = "charter-app"
version = "0.0.0"
edition = "2024"
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
# ponytail: wgpu for Mapperatorinator's timing model, which took over 15 minutes a song on the CPU
# and takes one or two on a graphics card; fusion and autotune as timingator runs it.
burn = { workspace = true, features = ["wgpu", "fusion", "autotune"] }
charter-audio.workspace = true
charter-autotiming.workspace = true
charter-beatthis-burn.workspace = true
charter-core.workspace = true
charter-osu-mania.workspace = true
charter-stepmania.workspace = true
charter-ttr.workspace = true
charter-ui.workspace = true
eframe = { workspace = true, features = ["persistence"] }
image.workspace = true
kira.workspace = true
rfd.workspace = true
timingator.workspace = true
serde.workspace = true
system-fonts.workspace = true
timestretch.workspace = true
ureq.workspace = true
