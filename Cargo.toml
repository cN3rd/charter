[workspace]
members = [
    "crates/charter-audio",
    "crates/charter-autotiming",
    "crates/charter-beatthis-burn",
    "crates/charter-core",
    "crates/charter-editor",
    "crates/charter-style",
    "crates/charter-timing",
    "crates/charter-ui",
    "crates/charter-app",
    "plugins/stepmania",
    "plugins/ttr",
    "plugins/osu-mania",
    "third-party/symphonia-wrap"
]
resolver = "3"

[workspace.package]
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[workspace.dependencies]
charter-audio = { path = "crates/charter-audio" }
charter-autotiming = { path = "crates/charter-autotiming" }
charter-beatthis-burn = { path = "crates/charter-beatthis-burn" }
charter-core = { path = "crates/charter-core" }
charter-editor = { path = "crates/charter-editor" }
charter-style = { path = "crates/charter-style" }
charter-timing = { path = "crates/charter-timing" }
charter-ui = { path = "crates/charter-ui" }
charter-stepmania = { path = "plugins/stepmania" }
charter-ttr = { path = "plugins/ttr" }
charter-osu-mania = { path = "plugins/osu-mania" }
serde = { version = "1.0.229", features = ["derive"] }
# ponytail: exact float parsing costs about 1.5x on float-heavy input; the format promises
# values survive a round trip, and the default parser drifts one value in ten.
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
thiserror = "2.0.20"
symphonia-wrap = { path = "third-party/symphonia-wrap" }
rustfft = "6.4.1"
# ponytail: CPU inference only; the flex backend runs everywhere charter does, and a GPU backend
# is a feature away if the beat tracker proves too slow.
burn = { version = "0.21.0", default-features = false, features = ["std", "flex"] }
burn-store = { version = "0.21.0", default-features = false, features = ["std", "pytorch", "safetensors"] }
# ponytail: named only for its default features, SIMD and threads, which burn's own defaults would
# otherwise be the only way to turn on.
burn-flex = "0.21.0"
rubato = "5.0.0"
# ponytail: blocking, rustls; charter's one download, the beat tracker's weights, needs no runtime.
ureq = "3.4.2"
audioadapter-buffers = "5.1.0"
egui = "0.36.2"
eframe = "0.36.2"
rfd = "0.17.2"
# ponytail: kira's own symphonia is off; charter-audio decodes through symphonia-wrap and hands
# kira frames.
kira = { version = "0.12.4", default-features = false, features = ["cpal"] }
egui-phosphor = "0.14.0"
# Already linked through eframe; charter adds JPEG, how most embedded covers are encoded.
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
# ponytail: finds installed fonts by family for CJK song titles; egui-system-fonts wraps it but
# writes into the egui context, which the window's own font setup would then replace.
system-fonts = "0.1.2"
egui_kittest = "0.36.2"
# ponytail: std only; the fork and timeout features pull in a temp-file runner the sans-io tests
# do not need.
proptest = { version = "1.11.0", default-features = false, features = ["std"] }

# ponytail: correctness enforced by the compiler, not by review.
# Loosen an individual lint at the call site with #[allow], don't weaken it here.
[workspace.lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }
missing_debug_implementations = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
indexing_slicing = "warn"

# ponytail: tick/sample arithmetic is everywhere in a charting app and silent wraparound
# is a nightmare to debug. Drop this if DSP profiling ever shows it costs real time.
[profile.release]
overflow-checks = true

# What `just dist` packages: a release build without its symbols.
[profile.dist]
inherits = "release"
strip = true

# Workspace optimizations to workspace to third-party dependencies
# which are noticeably slow on debug builds
[profile.dev.package.symphonia]
opt-level = 3

[profile.dev.package."symphonia-bundle-mp3"]
opt-level = 3

[profile.dev.package."symphonia-codec-aac"]
opt-level = 3

[profile.dev.package."symphonia-bundle-flac"]
opt-level = 3

[profile.dev.package."symphonia-codec-adpcm"]
opt-level = 3

[profile.dev.package."symphonia-codec-alac"]
opt-level = 3

[profile.dev.package."symphonia-codec-pcm"]
opt-level = 3

[profile.dev.package."symphonia-codec-vorbis"]
opt-level = 3

[profile.dev.package."symphonia-common"]
opt-level = 3

[profile.dev.package."symphonia-core"]
opt-level = 3

[profile.dev.package."symphonia-format-caf"]
opt-level = 3

[profile.dev.package."symphonia-format-isomp4"]
opt-level = 3

[profile.dev.package."symphonia-format-ogg"]
opt-level = 3

[profile.dev.package."symphonia-format-riff"]
opt-level = 3

[profile.dev.package."symphonia-metadata"]
opt-level = 3

# kira mixes on the audio thread, where an unoptimized build crackles.
[profile.dev.package.kira]
opt-level = 3

[profile.dev.package."symphonia-wrap"]
opt-level = 3

# The beat tracker runs a 20M-parameter network on the CPU; unoptimized, one song takes minutes.
# Burn's kernels are generic, so they compile in the crate that names the backend: the tracker's own
# crate needs optimizing too. Its API is not generic, so nothing past it instantiates them.

[profile.dev.package."charter-beatthis-burn"]
opt-level = 3

[profile.dev.package."burn-backend"]
opt-level = 3

[profile.dev.package."burn-core"]
opt-level = 3

[profile.dev.package."burn-flex"]
opt-level = 3

[profile.dev.package."burn-nn"]
opt-level = 3

[profile.dev.package."burn-std"]
opt-level = 3

[profile.dev.package."burn-tensor"]
opt-level = 3

[profile.dev.package."burn-store"]
opt-level = 3

[profile.dev.package."gemm"]
opt-level = 3

[profile.dev.package."gemm-common"]
opt-level = 3

[profile.dev.package."gemm-f32"]
opt-level = 3

[profile.dev.package."pulp"]
opt-level = 3

[profile.dev.package."dyn-stack"]
opt-level = 3

[profile.dev.package."aligned-vec"]
opt-level = 3

[profile.dev.package."rayon"]
opt-level = 3

[profile.dev.package."rayon-core"]
opt-level = 3

[profile.dev.package."bytemuck"]
opt-level = 3

[profile.dev.package."num-traits"]
opt-level = 3

[profile.dev.package."macerator"]
opt-level = 3

[profile.dev.package."half"]
opt-level = 3

[profile.dev.package."rubato"]
opt-level = 3

[profile.dev.package."realfft"]
opt-level = 3

[profile.dev.package."rustfft"]
opt-level = 3
