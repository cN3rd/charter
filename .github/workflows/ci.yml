name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CHARTER_BUILD: ci-${{ github.run_number }}

jobs:
  format-and-book:
    name: Format and book
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: taiki-e/install-action@v2
        with:
          tool: just,mdbook
      - run: just fmt-check
      - run: just docs
      - run: just docs-check
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/book
      - run: just pack-check

  rust:
    name: Rust ${{ matrix.task }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        task: [clippy, test]
    env:
      RUSTFLAGS: -D warnings
    steps:
      # ponytail: since burn 0.22 the debug test build fills the runner's disk, so the runner's
      # unused Android, .NET and Haskell SDKs go first; turn debug info off here if that stops
      # being enough.
      - if: matrix.task == 'test'
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: rui314/setup-mold@v1
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.task }}
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev pkg-config
      - run: just ${{ matrix.task }}

  kani:
    name: Kani proofs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: rui314/setup-mold@v1
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: model-checking/kani-github-action@v1
        with:
          kani-version: 0.68.0
          command: just kani

  package:
    name: Package ${{ matrix.os }}
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.runner }}
    # On Windows a cold cache spends half an hour on burn's kernels alone.
    timeout-minutes: 120
    strategy:
      matrix:
        include:
          - os: linux
            runner: ubuntu-latest
          - os: windows
            runner: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: dist-${{ matrix.os }}
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - if: matrix.os == 'linux'
        uses: rui314/setup-mold@v1
      - if: matrix.os == 'linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev pkg-config zip
      # just's shebang recipes need Git's bash ahead of WSL's.
      - if: matrix.os == 'windows'
        run: |
          echo 'C:\Program Files\Git\bin' >> "$GITHUB_PATH"
          echo 'C:\Program Files\Git\usr\bin' >> "$GITHUB_PATH"
      - run: just dist-${{ matrix.os }}
      - uses: actions/upload-artifact@v7
        with:
          name: charter-${{ matrix.os }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  book:
    name: Publish the book
    needs: format-and-book
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  prerelease:
    name: Prerelease
    needs: [format-and-book, rust, kani, package]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Write release notes
        run: |
          previous="$(git tag --list 'ci-*' --sort=-version:refname --merged HEAD | head -n 1)"
          {
            echo "Built by CI from ${GITHUB_SHA}. Not a release: it may be broken, and may"
            echo "change the format without notice."
            echo
            echo "## Changes${previous:+ since $previous}"
            echo
            git log --no-merges --format='- %s (%h)' "${previous:+$previous..}HEAD"
          } > notes.md
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - run: >
          gh release create "$CHARTER_BUILD" dist/*
          --target "$GITHUB_SHA"
          --title "Development build $GITHUB_RUN_NUMBER"
          --notes-file notes.md
          --prerelease
        env:
          GH_TOKEN: ${{ github.token }}
