# Tests every push and pull request; each push to main then ships a prerelease built here.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  format-and-book:
    name: Format and book
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: taiki-e/install-action@v2
        with:
          tool: just,mdbook
      - run: just fmt-check
      - run: just docs
      - run: just docs-check

  rust:
    name: Rust ${{ matrix.task }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        task: [clippy, test]
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.task }}
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev pkg-config
      - run: just ${{ matrix.task }}

  # Slow, so beside the checks rather than after them; the crates linking burn are left out, as
  # `just kani` explains.
  kani:
    name: Kani proofs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: model-checking/kani-github-action@v1
        with:
          kani-version: 0.68.0
          args: --workspace --exclude charter-beatthis-burn --exclude charter-app

  package:
    name: Package ${{ matrix.os }}
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      matrix:
        include:
          - os: linux
            runner: ubuntu-latest
          # Built natively with MSVC rather than cross-compiled, so it is what Windows users run.
          - os: windows
            runner: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: dist-${{ matrix.os }}
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - if: matrix.os == 'linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev pkg-config zip
      # just runs its recipes, shebang ones included, through Git's bash and coreutils, which must
      # come before Windows' own `bash`, WSL's.
      - if: matrix.os == 'windows'
        run: |
          echo 'C:\Program Files\Git\bin' >> "$GITHUB_PATH"
          echo 'C:\Program Files\Git\usr\bin' >> "$GITHUB_PATH"
      - run: just dist-${{ matrix.os }}
      - uses: actions/upload-artifact@v7
        with:
          name: charter-${{ matrix.os }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  prerelease:
    name: Prerelease
    needs: [format-and-book, rust, kani, package]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The whole history and every tag, to find the last prerelease and list what came after.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Write release notes
        run: |
          previous="$(git tag --list 'ci-*' --sort=-version:refname --merged HEAD | head -n 1)"
          {
            echo "Built by CI from ${GITHUB_SHA}. Not a release: it may be broken, and may"
            echo "change the format without notice."
            echo
            echo "## Changes${previous:+ since $previous}"
            echo
            git log --no-merges --format='- %s (%h)' "${previous:+$previous..}HEAD"
          } > notes.md
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - run: >
          gh release create "ci-$GITHUB_RUN_NUMBER" dist/*
          --target "$GITHUB_SHA"
          --title "Development build $GITHUB_RUN_NUMBER"
          --notes-file notes.md
          --prerelease
        env:
          GH_TOKEN: ${{ github.token }}
