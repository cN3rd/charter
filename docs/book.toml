[book]
title = "Charter Docs"
authors = ["cN3rd"]
language = "en"

# The GitHub Pages path CI publishes the book under on every push to main.
[output.html]
site-url = "/charter/"
git-repository-url = "https://github.com/cN3rd/charter"
# mdbook's {path} already starts with src/.
edit-url-template = "https://github.com/cN3rd/charter/edit/main/docs/{path}"

# ponytail: 10 lines beats a cargo-install dependency. Swap for mdbook-frontmatter-strip
# if the book ever needs the metadata rendered rather than hidden.
[preprocessor.okf-frontmatter]
command = "just _okf-frontmatter"
