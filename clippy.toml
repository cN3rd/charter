# ponytail: tests may unwrap and index; a failed unwrap there is a failed test, not a crash.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-indexing-slicing-in-tests = true
allow-panic-in-tests = true
allow-dbg-in-tests = true
# Game and tool names that doc_markdown would otherwise want in backticks.
doc-valid-idents = ["StepMania", "ArrowVortex", "..",]
# Audio times are floats underneath: their sums cannot overflow and panic, as integers can. The
# names are the paths other crates see.
arithmetic-side-effects-allowed = ["charter_core::ResolvedTime", "charter_core::TimeShift"]
